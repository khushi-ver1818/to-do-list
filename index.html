<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My To-Do List</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="todo-container">
         
        <button id="darkModeBtn">🌙 Dark Mode</button>

        <h1>✨ My To-Do List ✨ </h1>
        <p>Plan it. Do it. Done. 🚀</p>

    <div class="input-section">

        <input type="text" id="taskInput" placeholder="Tasks ?">

        <select id="prioritySelect">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
        </select>
    <input type="date" id="dueDate">
    <button id="addTask">Add</button>

</div>   
        <div class="task-stats">
            <span>Total: <b id="totalTasks">0</b></span>
            <span>Completed: <b id="completedTasks">0</b></span>
            <span>Pending: <b id="pendingTasks">0</b></span>
        </div>
        <div class="search-section">
            <input 
               type="text" 
               id="searchInput" 
               placeholder="🔍 Search your tasks..."
            >
        </div>

        <div class="filter-buttons">
            <button class="filter-btn active-filter" data-filter="all">All</button>
            <button class="filter-btn" data-filter="active">Active</button>
            <button class="filter-btn" data-filter="completed">Completed</button>
        </div>
        <div class="priority-filters">
            <button class="priority-filter active-priority" data-priority="all">All Priority</button>
            <button class="priority-filter" data-priority="low">Low</button>
            <button class="priority-filter" data-priority="medium">Medium</button>
            <button class="priority-filter" data-priority="high">High</button>
        </div>

        <button id="clearCompleted">Clear Completed</button>

        <ul id="taskList">
            <li id="emptyMessage">📝 No tasks yet. Add a task to get started!</li>
        </ul>

    </div>

    <script src="script.js"></script>

</body>
</html>
